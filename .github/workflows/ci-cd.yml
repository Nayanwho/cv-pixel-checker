name: CI/CD Pipeline & Privacy Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies for Node Canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev giflib-tools librsvg2-dev

      - name: Install Dependencies
        run: npm ci

      - name: Automated Repository Privacy Audit
        run: npm run privacy-check

      - name: Run Full Test Suite
        run: npm test

      - name: Build Production Application
        run: npm run build
